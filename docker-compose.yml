services:
  luma:
    build:
      context: .
    image: luma:local
    ports:
      - '${LUMA_PORT:-3000}:3000'
    volumes:
      - luma-data:/app/data
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: file:/app/data/luma.db
      DATA_DIR: /app/data
      WEB_DIST_DIR: /app/web
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  luma-data:
